<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Whispr is a modern, real-time web messenger with secure channels, media attachments, typing indicators, and presence tracking.">
    <meta name="theme-color" content="#3b82f6">
    <meta property="og:title" content="Whispr - Real-Time Web Messenger">
    <meta property="og:description" content="Connect and chat in real-time with Whispr's sleek, responsive messaging app.">
    <meta property="og:type" content="website">
    <title>Whispr - Real-Time Web Messenger</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-uUM_LFKh.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DotX53B-.css">
</head>

<body>
    <h1 class="sr-only">Whispr - Real-Time Web Messenger</h1>

    <!-- Ambient Glowing Light Orbs for Background Depth -->
    <div class="ambient-glow-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Initial App Loader Screen -->
    <div id="app-loader" class="app-loader" style="display: flex;">
        <div class="loader-content">
            <svg class="loader-logo" viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="#3b82f6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <div class="loader-spinner"></div>
        </div>
    </div>

    <!-- Main Messenger Container -->
    <div id="app-container" style="display: none;">
        <!-- Contacts Sidebar -->
        <aside class="contacts-section" aria-label="Contacts Directory">
            <div class="sidebar-brand-header">
                <div class="brand-title">
                    <svg class="brand-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span>Whispr</span>
                    <span class="live-status-pill"><span class="pulse-dot"></span>Online</span>
                </div>
                <button id="new-chat-btn" class="icon-nav-btn" type="button" aria-label="New Chat" title="Start New Chat (⌘N)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
            </div>

            <div class="search-box-wrap">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <label for="search-bar" class="sr-only">Search conversations</label>
                <input id="search-bar" type="search" placeholder="Search conversations..." aria-label="Search conversations">
                <kbd class="search-kbd">⌘K</kbd>
            </div>

            <!-- Filter Tabs -->
            <nav class="chat-filter-tabs" aria-label="Chat filters">
                <button class="filter-tab active" data-filter="all" type="button">All</button>
                <button class="filter-tab" data-filter="unread" type="button">Unread</button>
                <button class="filter-tab" data-filter="online" type="button">Online</button>
            </nav>

            <div id="contacts" role="list" aria-label="Conversations List">
                <!-- Contacts rendered by JS -->
            </div>

            <nav id="user-profile" aria-label="User Profile">
                <!-- User Profile rendered by JS -->
            </nav>
        </aside>

        <!-- Active Chat Area -->
        <main class="chat-section">
            <header id="chat-header" style="display: none;">
                <!-- Chat header rendered by JS -->
            </header>
            <section id="chat-window" aria-label="Message Stream">
                <div id="output" role="log" aria-live="polite">
                    <!-- Message stream rendered by JS -->
                </div>
            </section>
            <footer id="input-area" style="display: none;">
                <!-- Input composer rendered by JS -->
            </footer>
        </main>
    </div>

    <!-- Confirm Delete Chat Dialog Modal -->
    <dialog id="custom-alert" aria-labelledby="delete-chat-title">
        <div class="alert-content">
            <h2 id="delete-chat-title">Delete Chat History</h2>
            <p>Are you sure you want to delete all messages in this conversation? This action cannot be undone.</p>
            <button id="confirm-delete-chat" type="button">Delete</button>
            <button id="cancel-delete-chat" type="button">Cancel</button>
        </div>
    </dialog>

</body>

</html>
