<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Whispr is a modern, responsive web messenger application featuring real-time chat, media sharing, and online status indicators.">
    <meta name="theme-color" content="#5865f2">
    <meta property="og:title" content="Whispr - Real-Time Web Messenger">
    <meta property="og:description" content="Connect and chat in real-time with Whispr's sleek, responsive messaging app.">
    <meta property="og:type" content="website">
    <title>Whispr - Real-Time Web Messenger</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235865f2'><path d='M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z'/></svg>">
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <h1 class="sr-only">Whispr - Real-Time Web Messenger</h1>
    <main id="login-container">
        <h2>Get Started</h2>
        <label for="username" class="sr-only">Enter your name</label>
        <input id="username" type="text" placeholder="Enter your name" autofocus aria-label="Enter your name" autocomplete="username">
        <button id="login" type="button">Login</button>
    </main>

    <div id="app-container" style="display: none;">
        <aside class="contacts-section" aria-label="Contacts Navigation">
            <nav id="user-profile" aria-label="User Profile">
                <div class="name">User Name</div>
                <button id="logout-button" class="logout-button" type="button" aria-label="Logout">
                    <img src="images/logoutW.png" alt="" width="24" height="24">
                </button>
            </nav>
            <label for="search-bar" class="sr-only">Search conversations</label>
            <input id="search-bar" type="search" placeholder="Search conversations..." aria-label="Search conversations">
            <div id="contacts" role="list" aria-label="Conversations List">
                <!-- Dynamic contacts populated by JavaScript -->
            </div>
        </aside>

        <main class="chat-section">
            <header id="chat-header" style="display: none;">
                <!-- Dynamic chat header populated by JavaScript -->
            </header>
            <section id="chat-window" aria-label="Message Stream">
                <div id="output" role="log" aria-live="polite">
                    <div id="welcome-message">
                        <h2>Welcome to Whispr</h2>
                        <p>Select a contact to start chatting.</p>
                    </div>
                </div>
                <div id="feedback"></div>
            </section>
            <footer id="input-area" style="display: none;">
                <button id="attachment-button" type="button" aria-label="Attach file or image">
                    <img src="images/attachmentW.png" alt="" width="24" height="24">
                </button>
                <input type="file" id="media" style="display: none;" aria-label="Upload media file" accept="image/*">
                <label for="message" class="sr-only">Type a message</label>
                <input id="message" type="text" placeholder="Type a message..." aria-label="Type a message">
                <button id="send-button" type="button" aria-label="Send message">
                    <img src="images/sendW.png" alt="" width="24" height="24">
                </button>
            </footer>
        </main>
    </div>

    <!-- Delete Chat History Modal -->
    <dialog id="custom-alert" aria-labelledby="delete-chat-title">
        <div class="alert-content">
            <h2 id="delete-chat-title">Delete Chat</h2>
            <p>Are you sure you want to delete the chat history?</p>
            <button id="confirm-delete-chat" type="button">Yes</button>
            <button id="cancel-delete-chat" type="button">No</button>
        </div>
    </dialog>

    <!-- Logout Confirmation Modal -->
    <dialog id="logout-alert" aria-labelledby="logout-title">
        <div class="alert-content">
            <h2 id="logout-title">Logout</h2>
            <p>Are you sure you want to logout?</p>
            <button id="confirm-logout" type="button">Yes</button>
            <button id="cancel-logout" type="button">No</button>
        </div>
    </dialog>

    <!-- Alert Modal -->
    <dialog id="alert-modal" aria-labelledby="alert-message">
        <div class="alert-content">
            <p id="alert-message"></p>
            <button id="alert-ok-button" type="button">OK</button>
        </div>
    </dialog>

</body>

</html>
